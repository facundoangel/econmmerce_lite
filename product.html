<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calzados Rivadavia | Tienda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ── Skeleton loading ── */
        .placeholder {
            background: #e0e0e0;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .placeholder::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150px;
            height: 100%;
            width: 150px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: loading 1.2s infinite;
        }

        @keyframes loading {
            100% {
                left: 100%;
            }
        }

        /* ── Blobs decorativos ── */
        .content-image::before {
            content: "";
            width: 60%;
            height: 400px;
            background-color: #e6a22680;
            position: absolute;
            top: -115px;
            left: -79px;
            border-radius: 50%;
            filter: blur(61px);
            z-index: -1;
            pointer-events: none;
        }

        .content-info::before {
            content: "";
            width: 60%;
            height: 400px;
            background-color: #e6a22680;
            position: absolute;
            bottom: -60%;
            right: 0;
            border-radius: 50%;
            filter: blur(77px);
            z-index: -2;
            pointer-events: none;
        }

        /* ── Chips de talle activo ── */
        .size-chip.active {
            background: #1f2937;
            color: #fff;
            border-color: #1f2937;
        }

        /* ── Scrollbar oculto en thumbnails ── */
        .thumb-scroll::-webkit-scrollbar {
            display: none;
        }

        .thumb-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ── Transición suave de imagen ── */
        #image-product {
            transition: opacity .25s ease;
        }

        /* Drawer overlay */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 176px;
            background: white;
            z-index: 50;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding: 24px 20px;
        }

        .drawer.open {
            transform: translateX(0);
        }
    </style>
</head>

<body class="overflow-x-hidden relative flex flex-col items-center bg-white min-h-screen">

    <!-- ══════════════ NAV ══════════════ -->
    <nav
        class="fixed bg-white w-[90%] rounded-full py-1 px-10 z-50 text-right shadow-md flex justify-between m-auto left-0 right-0 top-2">

        <a href="/"><img src="https://i.imgur.com/vwNK99i.png" alt="logo" width="80px" style="filter: invert(.5)"></a>
        <div class="flex items-center gap-8">
            <a href="/" class="font-semibold mx-2 text-gray-700 hidden sm:block">Inicio</a>
            <a href="/store.html"
                class="hidden sm:block font-semibold mx-2 bg-orange-500 rounded-full py-1 px-4 text-white">Tienda</a>
            <button id="btn-open-menu" class="sm:hidden">
                <svg width="30px" height="30px" clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round"
                    stroke-miterlimit="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="m11 16.745c0-.414.336-.75.75-.75h9.5c.414 0 .75.336.75.75s-.336.75-.75.75h-9.5c-.414 0-.75-.336-.75-.75zm-9-5c0-.414.336-.75.75-.75h18.5c.414 0 .75.336.75.75s-.336.75-.75.75h-18.5c-.414 0-.75-.336-.75-.75zm4-5c0-.414.336-.75.75-.75h14.5c.414 0 .75.336.75.75s-.336.75-.75.75h-14.5c-.414 0-.75-.336-.75-.75z"
                        fill-rule="nonzero" />
                </svg>
            </button>
        </div>
    </nav>
    <div id="menu-responsive" class="drawer sm:hidden z-50" style="border-right: 1px solid #79767682;">
        <div class="flex flex-col items-start mb-6 ">
            <!--<h2 class="text-base font-semibold">Filtros</h2>-->
            <button id="button-close-menu" class="text-gray-400 hover:text-gray-700 self-end">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" strokeWidth={2}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="flex flex-col mt-10 gap-4">
                <a href="/" class="font-semibold mx-2 text-gray-700">Inicio</a>
                <hr class="w-[156%]">
                <a href="/store.html"
                    class="font-semibold mx-2 bg-orange-500 rounded-full py-1 ms-[-10px] px-4 text-white">Tienda</a>
            </div>
        </div>
    </div>

    <!-- ══════════════ MAIN ══════════════ -->
    <main class="w-full max-w-[1400px] px-4 sm:px-6 lg:px-10 py-24 mt-4">

        <!-- Botón volver -->
        <button
            class="mb-6 px-4 py-2 bg-white rounded-full text-gray-700 text-sm shadow-md font-bold flex items-center gap-2 hover:shadow-lg transition-shadow">
            <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="m9.474 5.209s-4.501 4.505-6.254 6.259c-.147.146-.22.338-.22.53s.073.384.22.53c1.752 1.754 6.252 6.257 6.252 6.257.145.145.336.217.527.217.191-.001.383-.074.53-.221.293-.293.294-.766.004-1.057l-4.976-4.976h14.692c.414 0 .75-.336.75-.75s-.336-.75-.75-.75h-14.692l4.978-4.979c.289-.289.287-.761-.006-1.054-.147-.147-.339-.221-.53-.221-.191-.001-.38.071-.525.215z"
                    fill-rule="nonzero" />
            </svg>
            <a href="/store.html">Atrás</a>
        </button>

        <!-- Grid principal: apilado en mobile, lado a lado en desktop -->
        <div class="flex flex-col lg:flex-row gap-8 lg:gap-12 items-start">

            <!-- ── Columna imagen ── -->
            <div class="content-image relative w-full lg:w-[55%]">

                <!-- Imagen principal -->
                <div id="content-image-product"
                    class="bg-gray-300 w-full rounded-3xl shadow-xl relative placeholder overflow-hidden"
                    style="aspect-ratio: 4/3;">

                    <img id="image-product" class="object-cover w-full h-full hidden"
                        src="https://i.imgur.com/QT6nzSM.png" alt="Producto">

                    <!-- Flechas de navegación -->
                    <div class="absolute bottom-3 right-3 flex gap-2">
                        <button id="arrow-to-left"
                            class="opacity-25 bg-white/70 backdrop-blur-sm rounded-full p-2 sm:p-3 shadow transition-opacity hover:opacity-80"
                            aria-label="Imagen anterior">
                            <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="m9.474 5.209s-4.501 4.505-6.254 6.259c-.147.146-.22.338-.22.53s.073.384.22.53c1.752 1.754 6.252 6.257 6.252 6.257.145.145.336.217.527.217.191-.001.383-.074.53-.221.293-.293.294-.766.004-1.057l-4.976-4.976h14.692c.414 0 .75-.336.75-.75s-.336-.75-.75-.75h-14.692l4.978-4.979c.289-.289.287-.761-.006-1.054-.147-.147-.339-.221-.53-.221-.191-.001-.38.071-.525.215z"
                                    fill-rule="nonzero" />
                            </svg>
                        </button>
                        <button id="arrow-to-right"
                            class="bg-white/70 backdrop-blur-sm rounded-full p-2 sm:p-3 shadow transition-opacity hover:opacity-80"
                            aria-label="Imagen siguiente">
                            <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="m14.523 18.787s4.501-4.505 6.255-6.26c.146-.146.219-.338.219-.53s-.073-.383-.219-.53c-1.753-1.754-6.255-6.258-6.255-6.258-.144-.145-.334-.217-.524-.217-.193 0-.385.074-.532.221-.293.292-.295.766-.004 1.056l4.978 4.978h-14.692c-.414 0-.75.336-.75.75s.336.75.75.75h14.692l-4.979 4.979c-.289.289-.286.762.006 1.054.148.148.341.222.533.222.19 0 .378-.072.522-.215z"
                                    fill-rule="nonzero" />
                            </svg>
                        </button>
                    </div>

                    <!-- Dots indicadores (se generan por JS) -->
                    <div id="dots-container"
                        class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5 pointer-events-none"></div>
                </div>

                <!-- Thumbnails (scroll horizontal) -->
                <div id="thumbnails-row" class="thumb-scroll flex gap-2 mt-3 overflow-x-auto p-1">
                </div>

            </div>

            <!-- ── Columna info ── -->
            <div class="content-info relative w-full lg:w-[45%] flex flex-col gap-6 py-2 lg:py-10">

                <!-- Título skeleton / real -->
                <div>
                    <h1 id="title-product" class="text-3xl sm:text-4xl font-bold text-gray-800">
                        <div class="placeholder w-64 h-[30px]"></div>
                    </h1>
                </div>

                <!-- Descripción -->
                <div id="description-product" class="text-sm text-gray-500 leading-relaxed">
                    <div class="placeholder w-64 h-[12px]"></div>
                    <div class="placeholder w-48 h-[12px] mt-2"></div>
                    <div class="placeholder w-40 h-[12px] mt-2"></div>
                </div>

                <!-- Talles -->
                <div>
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Talle</p>
                    <div id="sizes-product" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- Colores -->
                <div id="colors-product" class="hidden">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Color</p>
                    <div class="flex gap-2">
                        <button
                            class="w-6 h-6 bg-white rounded-full border-2 border-gray-300 hover:scale-110 transition-transform"
                            title="Blanco"></button>
                        <button
                            class="w-6 h-6 bg-stone-950 rounded-full border-2 border-gray-300 hover:scale-110 transition-transform"
                            title="Negro"></button>
                        <button
                            class="w-6 h-6 bg-sky-900 rounded-full border-2 border-gray-300 hover:scale-110 transition-transform"
                            title="Azul"></button>
                        <button
                            class="w-6 h-6 bg-green-900 rounded-full border-2 border-gray-300 hover:scale-110 transition-transform"
                            title="Verde"></button>
                    </div>
                </div>

                <!-- Precio (opcional, se puede poblar desde API) -->
                <div id="price-product" class="hidden">
                    <p class="text-2xl font-bold text-gray-900"></p>
                </div>

                <!-- CTA -->
                <a id="link-comprar-prod" target="_blank">
                    <div class="pt-2">
                        <button
                            class="w-full sm:w-auto px-8 py-3 bg-orange-500 shadow-lg shadow-orange-500/40 rounded-full text-white text-lg font-bold hover:bg-orange-600 active:scale-95 transition-all">
                            Comprar
                        </button>
                    </div>
                </a>

            </div>
        </div>
    </main>

    <!-- ══════════════ FOOTER ══════════════ -->
    <footer class="bg-black text-gray-100 px-6 sm:px-8 py-8 mt-16 z-50 relative w-full">
        <div class="max-w-7xl mx-auto">

            <div class="flex flex-wrap justify-between items-center mb-8 text-sm gap-4">
                <div class="flex flex-col sm:flex-row gap-4 sm:gap-8">
                    <div class="flex items-center gap-2 text-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 5a2 2 0 013.586-1.414L9 6l-1 4 2 2 4-1 2.414 2.414A2 2 0 0119 15v2a2 2 0 01-2 2C7.163 19 3 10.837 3 7V5z" />
                        </svg>
                        <span>123 4567 8910</span>
                    </div>
                    <div class="flex items-center gap-2 text-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <a href="mailto:demo@example.com" class="hover:underline">demo@example.com</a>
                    </div>
                </div>
            </div>

            <div
                class="flex flex-wrap justify-between items-center text-xs text-gray-400 border-t border-gray-700 pt-3 gap-3">
                <p>© <span id="current-year"></span> By Facundo Angel</p>
                <div class="flex items-center gap-3">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png" alt="MasterCard"
                        class="h-6 object-contain" />
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/30/American_Express_logo.svg"
                        alt="American Express" class="h-6 object-contain brightness-0 invert" />
                </div>
            </div>

        </div>
    </footer>

    <!-- ══════════════ SCRIPT ══════════════ -->
    <script>
        document.getElementById("current-year").textContent = new Date().getFullYear();

        let currentImage = 0;
        let imagesToShow = [];

        /* ── helpers ── */
        function updateArrows() {
            const left = document.getElementById("arrow-to-left");
            const right = document.getElementById("arrow-to-right");
            left.classList.toggle("opacity-25", currentImage === 0);
            right.classList.toggle("opacity-25", currentImage === imagesToShow.length - 1);
        }

        function setImage(idx) {
            const img = document.getElementById("image-product");
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = imagesToShow[idx];
                img.style.opacity = 1;
            }, 120);

            // actualizar dots
            document.querySelectorAll(".dot").forEach((d, i) => {
                d.classList.toggle("bg-orange-500", i === idx);
                d.classList.toggle("bg-white/60", i !== idx);
            });

            // actualizar thumbnails
            document.querySelectorAll(".thumb").forEach((t, i) => {
                t.classList.toggle("ring-2", i === idx);
                t.classList.toggle("ring-orange-500", i === idx);
                t.classList.toggle("opacity-50", i !== idx);
            });

            updateArrows();
        }

        function buildDots(count) {
            const container = document.getElementById("dots-container");
            container.innerHTML = "";
            if (count <= 1) return;
            for (let i = 0; i < count; i++) {
                const d = document.createElement("span");
                d.className = `dot w-2 h-2 rounded-full transition-colors ${i === 0 ? "bg-orange-500" : "bg-white/60"}`;
                container.appendChild(d);
            }
        }

        function buildThumbnails(images) {
            const row = document.getElementById("thumbnails-row");
            row.innerHTML = "";
            if (images.length <= 1) return;
            images.forEach((src, i) => {
                const btn = document.createElement("button");
                btn.className = `thumb flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 rounded-xl overflow-hidden border-2 border-transparent transition-all ${i === 0 ? "ring-2 ring-orange-500" : "opacity-50"}`;
                const img = document.createElement("img");
                img.src = src;
                img.alt = `Vista ${i + 1}`;
                img.className = "w-full h-full object-cover";
                btn.appendChild(img);
                btn.addEventListener("click", () => {
                    currentImage = i;
                    setImage(i);
                });
                row.appendChild(btn);
            });
        }

        /* ── carga del producto ── */
        window.addEventListener("load", () => {
            const url = new URLSearchParams(location.search);
            const paramProduct = url.get("p");

            if (!paramProduct) {
                alert("Hay un error en la URL introducida.");
                return;
            }

            fetch(
                "https://script.google.com/macros/s/AKfycbyr83OflLLicBHoMzX304TSgxUIxqKknPTWNtQKB75js_9KLc0LHeoBgYs2-lpWkhRlxA/exec?p=singleProduct&q=" + paramProduct
            )
                .then(r => r.json())
                .then(({ mainImage, images, title, description, sizes, colors }) => {

                    /* título */
                    document.getElementById("title-product").textContent = title;

                    /* descripción */
                    document.getElementById("description-product").innerHTML = `<p>${description}</p>`;

                    /* imagen */
                    const imgEl = document.getElementById("image-product");
                    document.getElementById("content-image-product").classList.remove("placeholder");
                    imgEl.classList.remove("hidden");
                    imgEl.src = mainImage;

                    /* galería */
                    if (mainImage) imagesToShow.push(mainImage);
                    if (images) imagesToShow.push(...images.split(",").map(s => s.trim()).filter(Boolean));

                    buildDots(imagesToShow.length);
                    buildThumbnails(imagesToShow);
                    updateArrows();

                    /* ocultar flechas si solo hay 1 imagen */
                    if (imagesToShow.length <= 1) {
                        document.getElementById("arrow-to-left").classList.add("hidden");
                        document.getElementById("arrow-to-right").classList.add("hidden");
                    }

                    /* talles */
                    const sizesEl = document.getElementById("sizes-product");
                    sizesEl.innerHTML = "";
                    sizes.split(",").forEach(size => {
                        const chip = document.createElement("span");
                        chip.className = "size-chip border rounded px-2.5 py-1.5 text-[11px] cursor-pointer select-none bg-white text-gray-500 border-gray-300 hover:border-gray-900 hover:text-gray-900 transition-colors";
                        chip.textContent = size.trim();
                        chip.addEventListener("click", () => {
                            document.querySelectorAll(".size-chip").forEach(c => c.classList.remove("active"));
                            chip.classList.add("active");
                        });
                        sizesEl.appendChild(chip);
                    });


                    /* link de comprar el producto*/
                    document.getElementById("link-comprar-prod").href = `https://api.whatsapp.com/send?phone=5491150020503&text=hola estoy interesado/a en el producto: ${title} Codigo: ${paramProduct}`;

                    /* colores */
                    document.getElementById("colors-product").classList.remove("hidden");
                })
                .catch(() => alert("No se pudo cargar el producto. Intentá de nuevo más tarde."));

            /* flechas */
            document.getElementById("arrow-to-left").addEventListener("click", () => {
                if (currentImage > 0) { currentImage--; setImage(currentImage); }
            });
            document.getElementById("arrow-to-right").addEventListener("click", () => {
                if (currentImage < imagesToShow.length - 1) { currentImage++; setImage(currentImage); }
            });

            /* swipe táctil en la imagen principal */
            const imgWrapper = document.getElementById("content-image-product");
            let touchStartX = 0;
            imgWrapper.addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; }, { passive: true });
            imgWrapper.addEventListener("touchend", e => {
                const dx = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(dx) < 40) return;
                if (dx < 0 && currentImage < imagesToShow.length - 1) { currentImage++; setImage(currentImage); }
                if (dx > 0 && currentImage > 0) { currentImage--; setImage(currentImage); }
            });
        });


        document.getElementById("button-close-menu").addEventListener("click", () => {
            document.getElementById("menu-responsive").classList.remove("open");
        })

        document.getElementById("btn-open-menu").addEventListener("click", () => {
            document.getElementById("menu-responsive").classList.add("open");
        })
    </script>
</body>

</html>
