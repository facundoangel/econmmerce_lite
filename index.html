<style>

/*FUENTES*/
@import url('https://fonts.googleapis.com/css2?family=Monoton&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Prosto+One&display=swap');

.monoton-regular {
  font-family: "Monoton", sans-serif;
  font-weight: 400;
  font-style: normal;
}

.prosto-one-regular {
  font-family: "Prosto One", sans-serif;
  font-weight: 400;
  font-style: normal;
}

/*PSEUDOELEMENTOS*/
.content-image::before{
    position: absolute;
    top: 9%;
    left: 63%;
    content: " ";
    width: 133%;
    border-radius: 50%;
    height: 215%;
    background-color: #e6a22680;
    transform: translate(-60%, -20%);
    filter: blur(54px);
}

.presentation:before {
    content: "";
    width: 30%;
    height: 400px;
    background-color: #dd7b074a;
    position: absolute;
    top: -34px;
    filter: blur(60px);
}

.info-shoes-badge-left::before {
    content:"";
    width:9px;
    height:9px;
    background:orange;
    position:absolute;
    left:10px;
    top:50%;
    transform: translateY(-50%);
    border-radius:50%;
    box-shadow: 1px 1px 5px #ffc240, -1px -1px 5px #ffc240;
}

.info-shoes-badge-right::after {
    content:"";
    width:9px;
    height:9px;
    background:orange;
    position:absolute;
    right:12px;
    top:50%;
    transform: translateY(-50%);
    border-radius:50%;
    box-shadow: 1px 1px 5px #ffc240, -1px -1px 5px #ffc240;
}

.btn-add-cart::after {
    content:'+';
    font-weight:bold;
    position:absolute;
    bottom:5px;
    left:7px;
}


/*ANIMACIONES*/
.info-shoes-badge-right,.info-shoes-badge-left{
  animation-name: levitation;
  animation-duration: 3.5s;
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
}

@keyframes levitation {
  0% {transform: translateY(-20%);}
  50% {transform: translateY(30%);;}
  100% {transform: translateY(-20%);}
}


/*CLASES CUSTOM*/
.custom-shadows{
  box-shadow: 2px 2px 5px #575353, -2px -2px 5px #575353;
}

.image-shoes{
  padding-top: 100px;
  transform: rotate(344deg);
  
}

.btn-add-cart{
  box-shadow: -2px -2px 20px orange, 2px 1px 11px orange;
}

.image-product{
  transform: rotate(33deg) scale(.8) translateY(-10%);
  filter: drop-shadow(20px -2px 14px #5e5e5e);
}

/* Drawer overlay */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.drawer-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.drawer {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 176px;
  background: white;
  z-index: 50;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  overflow-y: auto;
  padding: 24px 20px;
}
.drawer.open {
  transform: translateX(0);
}



/*    Responsive  */

@media (max-width:767px){
  #grid-feature-product > a:nth-child(6){
    display: none;
  }
}

</style>

        <svg width="30px" height="30px" clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m11 16.745c0-.414.336-.75.75-.75h9.5c.414 0 .75.336.75.75s-.336.75-.75.75h-9.5c-.414 0-.75-.336-.75-.75zm-9-5c0-.414.336-.75.75-.75h18.5c.414 0 .75.336.75.75s-.336.75-.75.75h-18.5c-.414 0-.75-.336-.75-.75zm4-5c0-.414.336-.75.75-.75h14.5c.414 0 .75.336.75.75s-.336.75-.75.75h-14.5c-.414 0-.75-.336-.75-.75z" fill-rule="nonzero"/></svg>
      </button>
    </div>
  </nav>
  <div id="menu-responsive" class="drawer sm:hidden z-50" style="border-right: 1px solid #79767682;">
    <div class="flex flex-col items-start mb-6 " >
      <!--<h2 class="text-base font-semibold">Filtros</h2>-->
      <button id="button-close-menu" class="text-gray-400 hover:text-gray-700 self-end">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <div class="flex flex-col mt-10 gap-4" >
        <a  href="/" class="font-semibold mx-2 text-gray-700">Inicio</a>
        <hr class="w-[156%]">
        <a href="/store.html" class="font-semibold mx-2 bg-orange-500 rounded-full py-1 ms-[-10px] px-4 text-white">Tienda</a>

  <main class="presentation content w-100 flex flex-col pt-20 overflow-x-hidden md:overflow-visible">
    <div class="h-auto grow">
        <div class="grid md:grid-cols-2 md:min-h-[209vh]">
            <div class="relative md:order-2 md:min-h-[200vh] h-[270px]">
                <div class="content-image sticky inset-0 m-auto h-fit w-5/6" >
                    <img class="image-shoes w-11/12 sticky top-28 left-20 drop-shadow-2xl" src="https://iili.io/dA6hgBs.png" alt="imagen" />
                    <span class="info-shoes-badge-left bg-slate-100 outline z-10 absolute rounded-full ps-8 pe-4 outline-1 outline-slate-500 py-2 text-xs bottom-20 custom-shadows prosto-one-regular">100% algodon</span>
                    <span class="prosto-one-regular info-shoes-badge-right bg-slate-100 outline z-10 absolute rounded-full pe-8 ps-4 outline-1 outline-slate-500 py-2 text-xs custom-shadows" style="right: 51%;top: 21%;animation-delay: 0.5s;animation-duration: 4s;">confort</span>
                    <span class="info-shoes-badge-left bg-slate-100 outline z-10 absolute rounded-full ps-8 pe-4 outline-1 outline-slate-500 py-2 text-xs  custom-shadows prosto-one-regular" style="right: 21%;top: 46%;animation-delay: 0.3s;animation-duration: 3s;">calidad</span>
                </div>
            </div>
            <div class="relative md:order-1">
              <div class="relative md:h-screen min-h-[60vh]">

                    <div class="flex flex-col md:flex-row items-center gap-3 md:gap-8 my-10">
                        <p class="md:w-3/5 w-full text-small text-gray-800">Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the i</p>
                          <a href="/store.html">
                            <button class="btn-add-cart bg-orange-500 hover:bg-amber-400 text-white font-bold py-2 px-4 mt-10 md:m-0 rounded-full h-fit text-nowrap"">
                              Ver catalogo
                            </button>
                          </a>
                          <img class="absolute top-50 md:-right-32 right-[-22px] bottom-0" src="https://iili.io/dReJpx2.jpg" width="30%">
                    </div>
                    
                </div>
              </div>
              <div class="relative min-h-screen">
                <div class="md:absolute inset-0 my-15 mx-auto md:m-auto md:h-fit w-5/6">
                    <h2 class="text-5xl font-bold text-gray-800 text-center">Productos Destacados</h2>
                    <!-- React monta aquí -->
                    <div class="h-min" id="productos-root"></div>
                </div>
              </div>
            </div>
        </div>
    </div>
  </main>

 
  <footer  class="bg-black text-gray-100 px-8 py-8 mt-16 z-40 relative">
    <div  class="max-w-7xl mx-auto">

      <div  class="flex flex-wrap justify-between items-center mb-8 text-sm gap-4">
        <div  class="flex gap-8">
          <div  class="flex items-center gap-2 text-gray-100">
            <svg xmlns="http://www.w3.org/2000/svg"  class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 013.586-1.414L9 6l-1 4 2 2 4-1 2.414 2.414A2 2 0 0119 15v2a2 2 0 01-2 2C7.163 19 3 10.837 3 7V5z" />
            </svg>
            <span>123 4567 8910</span>
          </div>
          <div  class="flex items-center gap-2 text-gray-100">
            <svg xmlns="http://www.w3.org/2000/svg"  class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <a href="mailto:demo@example.com"  class="hover:underline">demo@example.com</a>
          </div>
        </div>
      </div>

      <div  class="flex flex-wrap justify-between items-center text-xs text-gray-400 border-t border-gray-300 pt-3 gap-3">
        <p>© <span id="current-year"></span> By Facundo Angel</p>
        <div  class="flex items-center gap-3">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png" alt="MasterCard"  class="h-6 object-contain" />
          <img src="https://upload.wikimedia.org/wikipedia/commons/3/30/American_Express_logo.svg" alt="American Express"  class="h-6 object-contain" />
        </div>
      </div>

    </div>

  <script>
    const date_current = new Date()
    document.getElementById("current-year").innerText=date_current.getFullYear();
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const cartIcon = (
      <svg fill="#FFF" version="1.1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 26 28">
        <path d="M19 11c0-0.547-0.453-1-1-1h-2v-2c0-0.547-0.453-1-1-1s-1 0.453-1 1v2h-2c-0.547 0-1 0.453-1 1s0.453 1 1 1h2v2c0 0.547 0.453 1 1 1s1-0.453 1-1v-2h2c0.547 0 1-0.453 1-1zM10 24c0 1.109-0.891 2-2 2s-2-0.891-2-2 0.891-2 2-2 2 0.891 2 2zM24 24c0 1.109-0.891 2-2 2s-2-0.891-2-2 0.891-2 2-2 2 0.891 2 2zM26 7v8c0 0.5-0.375 0.938-0.891 1l-16.312 1.906c0.063 0.344 0.203 0.734 0.203 1.094s-0.219 0.688-0.375 1h14.375c0.547 0 1 0.453 1 1s-0.453 1-1 1h-16c-0.547 0-1-0.453-1-1 0-0.484 0.734-1.687 0.953-2.141l-2.766-12.859h-3.187c-0.547 0-1-0.453-1-1s0.453-1 1-1h4c1.062 0 1.078 1.25 1.234 2h18.766c0.547 0 1 0.453 1 1z"></path>
      </svg>
    );

    function ProductoDestacado({ producto, grande }) {
      const { nombre, precio, marca, talles, imagen, codigo } = producto;

      const linkWhatsapp = `https://api.whatsapp.com/send?phone=5491150020503&text=hola estoy interesado/a en el producto: ${nombre} - ${marca} codigo producto: ${codigo}`;

      if (grande) {
        return (
          <a href={`./product.html?p=${codigo}`} target="_blank" className="w-full h-full md:row-span-2 col-span-2">
            <div className="bg-gray-100 w-full h-40 md:h-80 rounded-3xl shadow-xl flex justify-center">
              <img
                className="image-product h-48 md:h-96"
                src={imagen || "https://i.imgur.com/s3ohiBp.png"}
                alt={nombre}
                onError={e => { e.target.src = "https://i.imgur.com/s3ohiBp.png"; }}
              />
            </div>
            <h2 className="text-2xl font-semibold mt-3 text-slate-700">{nombre}</h2>
            <p className="text-sm font-light text-slate-400">{marca}</p>
            <div className="flex justify-between justify-start md:items-center flex-col md:flex-row gap-2 md:gap-0">
              <span className="text-slate-700 font-bold text-xl">ARS {Number(precio).toLocaleString('es-AR')}</span>
              <a href={linkWhatsapp} target="_blank">
                <button className="btn-add-cart rounded-full items-center flex gap-2 bg-orange-500 hover:bg-orange-400 py-4 px-4 text-slate-100 text-sm">
                  <svg fill="#FFF" version="1.1" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 26 28">
                    <path d="M19 11c0-0.547-0.453-1-1-1h-2v-2c0-0.547-0.453-1-1-1s-1 0.453-1 1v2h-2c-0.547 0-1 0.453-1 1s0.453 1 1 1h2v2c0 0.547 0.453 1 1 1s1-0.453 1-1v-2h2c0.547 0 1-0.453 1-1zM10 24c0 1.109-0.891 2-2 2s-2-0.891-2-2 0.891-2 2-2 2 0.891 2 2zM24 24c0 1.109-0.891 2-2 2s-2-0.891-2-2 0.891-2 2-2 2 0.891 2 2zM26 7v8c0 0.5-0.375 0.938-0.891 1l-16.312 1.906c0.063 0.344 0.203 0.734 0.203 1.094s-0.219 0.688-0.375 1h14.375c0.547 0 1 0.453 1 1s-0.453 1-1 1h-16c-0.547 0-1-0.453-1-1 0-0.484 0.734-1.687 0.953-2.141l-2.766-12.859h-3.187c-0.547 0-1-0.453-1-1s0.453-1 1-1h4c1.062 0 1.078 1.25 1.234 2h18.766c0.547 0 1 0.453 1 1z"></path>
                  </svg>
                </button>
              </a>
            </div>
          </a>
        );
      }

      return (
        <a href={`./product.html?p=${codigo}`} target="_blank" className="w-full h-fit rounded-3xl">
          <div className="bg-gray-100 h-24 rounded-3xl shadow-xl flex justify-center">
            <img
              className="image-product h-28"
              src={imagen || "https://i.imgur.com/MlGjLR9.png"}
              alt={nombre}
              onError={e => { e.target.src = "https://i.imgur.com/MlGjLR9.png"; }}
            />
          </div>
          <h2 className="text-xl font-semibold mt-2 text-slate-700 min-h-[1.8em] leading-[20px]">{nombre}</h2>
          <p className="text-sm font-light text-slate-400">{marca}</p>
          <div className="flex justify-between justify-start md:items-center flex-col md:flex-row gap-2 md:gap-0">
            <span className="text-slate-700 font-bold text-md">ARS {Number(precio).toLocaleString('es-AR')}</span>
            <a href={linkWhatsapp} target="_blank">
              <button className="btn-add-cart rounded-full items-center flex gap-2 bg-orange-500 hover:bg-orange-400 py-2 px-2 text-slate-100 text-sm">
                {cartIcon}
              </button>
            </a>
          </div>
        </a>
      );
    }

    function ProductosDestacados() {
      const [productos, setProductos] = useState([]);
      const [cargando, setCargando] = useState(true);

      useEffect(() => {
        fetch("https://script.google.com/macros/s/AKfycbwVjDsIBcMJ5jy_hYu_I4EmeDbe7PLQDmRVIZb6kme7U6Ls_F5t5vuAG48OX-QtOwNZZA/exec?p=especialProducts")
          .then(r => r.json())
          .then(data => {
            debugger;
            const disponibles = data.filter(p => p.restante > 0);
            setProductos(disponibles.slice(0, 6));
            setCargando(false);
          })
          .catch(() => setCargando(false));
      }, []);

      if (cargando) {
        return (
          <div className="grid grid-cols-3 py-7 gap-y-2 gap-x-4 z-10">
            {[...Array(6)].map((_, i) => (
              <div key={i} className={`rounded-3xl bg-gray-100 animate-pulse ${i === 0 ? 'row-span-2 col-span-2 h-80' : 'h-52'}`}></div>
            ))}
          </div>
        );
      }

      if (productos.length === 0) {
        return <p className="text-center text-gray-400 py-10">No hay productos disponibles.</p>;
      }

      const [primero, ...resto] = productos;

      return (
        <div id="grid-feature-product" className="grid grid-cols-3 py-7 gap-y-4 md:gap-y-2 gap-x-2 md:gap-x-4 z-10 h-fit">
          <ProductoDestacado producto={primero} grande={true} />
          {resto.map(p => (
            <ProductoDestacado key={p.codigo} producto={p} grande={false} />
          ))}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('productos-root'));
    root.render(<ProductosDestacados />);


    document.getElementById("button-close-menu").addEventListener("click",()=>{
      document.getElementById("menu-responsive").classList.remove("open");
    })

    document.getElementById("btn-open-menu").addEventListener("click",()=>{
      document.getElementById("menu-responsive").classList.add("open");
    })

  </script>

</body>
